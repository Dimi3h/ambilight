# Build check for main and pull requests (publishing happens in release.yml).
# Actions are pinned to commits: what these workflows build runs as root on the TV.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Unit tests
        run: sh tests/run.sh
      - name: Build IPK
        run: sh build.sh
      - name: Shell syntax
        run: for f in service/*.sh service/ambilightctl tools/*.sh build.sh; do sh -n "$f"; done
      - name: Feed (dry run)
        run: |
          v=$(cat VERSION)
          python3 -I tools/make_feed.py --version "$v" --ipk "build/io.github.dimi3h.ambilight_${v}_arm.ipk" \
            --icon build/icon-256.png --out dist
          node -e 'JSON.parse(require("fs").readFileSync("dist/repo.json","utf8"))'
