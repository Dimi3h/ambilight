# Push a tag vX.Y.Z (matching VERSION) to publish a release. Its assets include repo.json,
# the Homebrew Channel feed: https://github.com/Dimi3h/ambilight/releases/latest/download/repo.json
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Tag matches VERSION
        run: |
          v=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $v" >&2; exit 1; }
      - name: Unit tests
        run: sh tests/run.sh
      - name: Build IPK
        run: sh build.sh
      - name: Feed
        run: |
          v=$(cat VERSION)
          python3 -I tools/make_feed.py --version "$v" --ipk "build/io.github.dimi3h.ambilight_${v}_arm.ipk" \
            --icon build/icon-256.png --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" --title "Ambilight $v" --notes-file dist/notes.md \
            dist/*.ipk dist/repo.json dist/description.html dist/icon.png dist/sha256sums
